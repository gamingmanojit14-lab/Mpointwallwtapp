<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>History · P2P Wallet</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen pb-24">

  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-md mx-auto flex items-center gap-3 px-4 py-3">
      <a href="dashboard.html" class="text-slate-400 hover:text-orange-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </a>
      <h1 class="font-bold text-lg">Transaction History</h1>
    </div>

    <!-- Filter tabs -->
    <div class="max-w-md mx-auto px-4 pb-3">
      <div class="grid grid-cols-3 gap-2 bg-slate-800 rounded-xl p-1">
        <button data-filter="all" class="filterBtn py-2 rounded-lg text-sm font-medium transition bg-orange-500 text-slate-900">All</button>
        <button data-filter="sent" class="filterBtn py-2 rounded-lg text-sm font-medium transition text-slate-400">Sent</button>
        <button data-filter="received" class="filterBtn py-2 rounded-lg text-sm font-medium transition text-slate-400">Received</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-2">
    <!-- Summary -->
    <div class="card p-4 grid grid-cols-2 gap-3 mb-2">
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider">Total Sent</p>
        <p id="totalSent" class="text-red-400 font-bold mono text-lg mt-1">0</p>
      </div>
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider">Total Received</p>
        <p id="totalReceived" class="text-green-400 font-bold mono text-lg mt-1">0</p>
      </div>
    </div>

    <!-- List -->
    <div id="txList" class="space-y-2">
      <div class="text-slate-500 text-sm text-center py-8">Loading…</div>
    </div>

    <!-- Load more -->
    <button id="btnLoadMore" class="hidden w-full py-3 text-sm text-orange-400 hover:text-orange-300">
      Load more
    </button>
  </main>

  <script>
    let myWalletId = null;
    let allTx = new Map(); // txId -> data
    let currentFilter = 'all';
    let lastDocSent = null;
    let lastDocReceived = null;
    let exhaustedSent = false;
    let exhaustedReceived = false;

    function getTime(t) {
      if (!t) return 0;
      if (t.toDate) return t.toDate().getTime();
      return new Date(t).getTime();
    }

    function render() {
      const list = document.getElementById('txList');
      let items = [...allTx.values()];

      // total calculations
      let sent = 0, received = 0;
      items.forEach((d) => {
        if (d.fromWalletId === myWalletId) sent += Number(d.amount || 0);
        else received += Number(d.amount || 0);
      });
      document.getElementById('totalSent').textContent = fmtPoints(sent);
      document.getElementById('totalReceived').textContent = fmtPoints(received);

      // filter
      if (currentFilter === 'sent') items = items.filter((d) => d.fromWalletId === myWalletId);
      if (currentFilter === 'received') items = items.filter((d) => d.toWalletId === myWalletId);

      // sort
      items.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));

      if (!items.length) {
        list.innerHTML = '<div class="text-slate-500 text-sm text-center py-8 card">No transactions</div>';
        return;
      }

      list.innerHTML = items.map((d) => {
        const isSent = d.fromWalletId === myWalletId;
        const counterparty = isSent ? (d.toName || d.toWalletId) : (d.fromName || d.fromWalletId);
        const dt = d.createdAt ? (d.createdAt.toDate ? d.createdAt.toDate() : new Date(d.createdAt)) : null;
        const timeStr = dt ? dt.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
        const meta = [d.note, d.source].filter(Boolean).join(' · ');

        return `
          <div class="card p-3 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full ${isSent ? 'bg-red-500/15' : 'bg-green-500/15'} flex items-center justify-center shrink-0">
              <span class="${isSent ? 'text-red-400' : 'text-green-400'} text-lg">${isSent ? '↑' : '↓'}</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">${counterparty || 'Unknown'}</p>
              <p class="text-xs text-slate-500 truncate">${timeStr}</p>
              ${meta ? `<p class="text-xs text-slate-500 truncate">${meta}</p>` : ''}
            </div>
            <div class="text-right shrink-0">
              <p class="${isSent ? 'text-red-400' : 'text-green-400'} font-semibold mono text-sm">${isSent ? '−' : '+'}${fmtPoints(d.amount)}</p>
              <p class="text-[10px] text-slate-500 uppercase">${isSent ? 'sent' : 'received'}</p>
            </div>
          </div>`;
      }).join('');
    }

    async function loadMoreSent() {
      if (exhaustedSent) return;
      let q = db.collection('transactions')
        .where('fromWalletId', '==', myWalletId)
        .orderBy('createdAt', 'desc')
        .limit(20);
      if (lastDocSent) q = q.startAfter(lastDocSent);
      const snap = await q.get();
      if (snap.empty) { exhaustedSent = true; return; }
      snap.docs.forEach((d) => allTx.set(d.id, { txId: d.id, ...d.data() }));
      lastDocSent = snap.docs[snap.docs.length - 1];
      if (snap.docs.length < 20) exhaustedSent = true;
    }

    async function loadMoreReceived() {
      if (exhaustedReceived) return;
      let q = db.collection('transactions')
        .where('toWalletId', '==', myWalletId)
        .orderBy('createdAt', 'desc')
        .limit(20);
      if (lastDocReceived) q = q.startAfter(lastDocReceived);
      const snap = await q.get();
      if (snap.empty) { exhaustedReceived = true; return; }
      snap.docs.forEach((d) => allTx.set(d.id, { txId: d.id, ...d.data() }));
      lastDocReceived = snap.docs[snap.docs.length - 1];
      if (snap.docs.length < 20) exhaustedReceived = true;
    }

    // --- Filter clicks ---
    document.querySelectorAll('.filterBtn').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.filterBtn').forEach((x) => {
          x.classList.remove('bg-orange-500', 'text-slate-900');
          x.classList.add('text-slate-400');
        });
        b.classList.add('bg-orange-500', 'text-slate-900');
        b.classList.remove('text-slate-400');
        currentFilter = b.dataset.filter;
        render();
      });
    });

    document.getElementById('btnLoadMore').addEventListener('click', async () => {
      const btn = document.getElementById('btnLoadMore');
      btn.textContent = 'Loading…';
      try {
        await Promise.all([loadMoreSent(), loadMoreReceived()]);
        render();
        if (exhaustedSent && exhaustedReceived) btn.classList.add('hidden');
        else btn.classList.remove('hidden');
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.textContent = 'Load more';
      }
    });

    // --- Init ---
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      myWalletId = await getOwnWalletId();
      if (!myWalletId) { toast('No wallet linked', 'error'); return; }

      // live updates for the newest page
      db.collection('transactions').where('fromWalletId', '==', myWalletId)
        .orderBy('createdAt', 'desc').limit(20)
        .onSnapshot((snap) => {
          snap.docs.forEach((d) => allTx.set(d.id, { txId: d.id, ...d.data() }));
          render();
        });
      db.collection('transactions').where('toWalletId', '==', myWalletId)
        .orderBy('createdAt', 'desc').limit(20)
        .onSnapshot((snap) => {
          snap.docs.forEach((d) => allTx.set(d.id, { txId: d.id, ...d.data() }));
          render();
        });

      // set pagination cursors from the initial snapshots
      try {
        const s1 = await db.collection('transactions').where('fromWalletId', '==', myWalletId)
          .orderBy('createdAt', 'desc').limit(20).get();
        if (!s1.empty) lastDocSent = s1.docs[s1.docs.length - 1];
        if (s1.docs.length < 20) exhaustedSent = true;

        const s2 = await db.collection('transactions').where('toWalletId', '==', myWalletId)
          .orderBy('createdAt', 'desc').limit(20).get();
        if (!s2.empty) lastDocReceived = s2.docs[s2.docs.length - 1];
        if (s2.docs.length < 20) exhaustedReceived = true;

        if (!exhaustedSent || !exhaustedReceived) {
          document.getElementById('btnLoadMore').classList.remove('hidden');
        }
      } catch (e) {
        console.warn('Pagination init:', e);
      }
    })();
  </script>
</body>
</html>
