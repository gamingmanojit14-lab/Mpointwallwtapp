<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Login · P2P Wallet</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-center p-6 bg-slate-900">

  <div class="max-w-sm mx-auto w-full">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center shadow-2xl shadow-orange-500/30">
        <svg viewBox="0 0 24 24" class="w-12 h-12 text-slate-900" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3.5c.83 0 1.5.67 1.5 1.5h-3c0-.83.67-1.5 1.5-1.5zM9 9h6v2H9V9zm0 4h3v2.5h4V18H9v-5z"/>
        </svg>
      </div>
      <h1 class="mt-6 text-2xl font-bold">P2P Wallet</h1>
      <p class="text-slate-400 text-sm mt-1">Peer-to-peer points, powered by Bitcoin vibes ⚡</p>
    </div>

    <!-- Card -->
    <div class="card p-6 space-y-4">
      <!-- Google Sign In -->
      <button id="btnGoogle"
        class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-semibold py-3 rounded-xl hover:bg-slate-100 transition">
        <svg viewBox="0 0 48 48" class="w-5 h-5">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.5C29.4 34.7 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.5 5.5C41.9 35.7 44 30.3 44 24c0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 text-slate-500 text-xs">
        <div class="flex-1 h-px bg-slate-700"></div>
        <span>OR</span>
        <div class="flex-1 h-px bg-slate-700"></div>
      </div>

      <!-- Email + Password -->
      <form id="formEmail" class="space-y-3" autocomplete="on">
        <input id="email" type="email" placeholder="Email" required autocomplete="email"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition" />
        <input id="password" type="password" placeholder="Password (min 6 chars)" minlength="6" required
          autocomplete="current-password"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition" />

        <button id="btnEmail" type="submit"
          class="btn-primary w-full py-3 rounded-xl transition disabled:opacity-60">
          Sign In / Sign Up
        </button>
      </form>

      <button id="btnForgot" class="w-full text-slate-400 text-sm hover:text-orange-400 transition">
        Forgot password?
      </button>
    </div>

    <div class="mt-6 text-center text-xs text-slate-500 leading-relaxed">
      <p>First time? Enter email + password (min 6 chars).</p>
      <p class="mt-1">We'll auto-create your account & wallet.</p>
    </div>
  </div>

  <script>
    /* ============================================================
     * login.html — Email/Password + Google sign-in
     * Handles auth/invalid-credential (new Firebase behavior)
     * ============================================================ */

    const $email = document.getElementById('email');
    const $password = document.getElementById('password');
    const $btnEmail = document.getElementById('btnEmail');

    /* ---------- Main sign-in / sign-up flow ---------- */
    async function doSignIn(email, password) {
      try {
        // Attempt sign-in
        await auth.signInWithEmailAndPassword(email, password);
        console.log('[login] signed in');
        return { created: false };
      } catch (err) {
        console.log('[login] sign-in error:', err.code);

        // New Firebase returns `invalid-credential` for BOTH:
        //   1. user not found
        //   2. wrong password
        // So we try to create the account. If it fails with
        // `email-already-in-use`, then the user exists → wrong password.
        if (
          err.code === 'auth/user-not-found' ||
          err.code === 'auth/invalid-credential' ||
          err.code === 'auth/invalid-login-credentials'
        ) {
          try {
            await auth.createUserWithEmailAndPassword(email, password);
            console.log('[login] account created');
            return { created: true };
          } catch (createErr) {
            console.log('[login] create error:', createErr.code);

            if (createErr.code === 'auth/email-already-in-use') {
              // User exists but password is wrong
              const e = new Error('Incorrect password. Please try again or reset it.');
              e.code = 'auth/wrong-password';
              throw e;
            }
            if (createErr.code === 'auth/weak-password') {
              const e = new Error('Password too weak. Use at least 6 characters.');
              e.code = createErr.code;
              throw e;
            }
            if (createErr.code === 'auth/invalid-email') {
              const e = new Error('Invalid email address.');
              e.code = createErr.code;
              throw e;
            }
            throw createErr;
          }
        }

        // Other error codes — re-throw with friendly messages
        throw err;
      }
    }

    /* ---------- Friendlier error messages ---------- */
    function friendlyError(e) {
      const map = {
        'auth/invalid-email': 'Invalid email address.',
        'auth/user-disabled': 'This account has been disabled.',
        'auth/wrong-password': 'Incorrect password. Try again or reset it.',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/email-already-in-use': 'This email is already registered.',
        'auth/too-many-requests': 'Too many attempts. Please wait a few minutes.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/operation-not-allowed': 'Email/Password sign-in is not enabled. Contact admin.',
        'auth/invalid-credential': 'Invalid credentials. Check email and password.',
        'auth/popup-blocked': 'Popup was blocked. Allow popups and try again.',
        'auth/popup-closed-by-user': 'Google sign-in cancelled.',
        'auth/cancelled-popup-request': 'Another sign-in is in progress. Please wait.',
        'auth/unauthorized-domain': 'This domain is not authorized. Contact admin.',
      };
      return map[e.code] || e.message || 'Sign-in failed. Please try again.';
    }

    /* ---------- Email form submit ---------- */
    document.getElementById('formEmail').addEventListener('submit', async (ev) => {
      ev.preventDefault();

      const email = $email.value.trim().toLowerCase();
      const password = $password.value;

      if (!email || !password) {
        toast('Enter email and password', 'error');
        return;
      }
      if (password.length < 6) {
        toast('Password must be at least 6 characters', 'error');
        return;
      }

      $btnEmail.disabled = true;
      $btnEmail.textContent = 'Please wait…';

      try {
        const result = await doSignIn(email, password);
        const user = auth.currentUser;

        // Set displayName on first sign-up
        if (user && !user.displayName) {
          try {
            await user.updateProfile({ displayName: email.split('@')[0] });
          } catch {}
        }

        toast(result.created ? 'Account created!' : 'Welcome back!', 'success', 1500);

        // Small delay so user sees toast
        setTimeout(() => {
          const next = new URLSearchParams(location.search).get('next');
          location.replace(next ? decodeURIComponent(next) : 'index.html');
        }, 400);
      } catch (e) {
        console.error('[login] failed:', e);
        toast(friendlyError(e), 'error', 4000);
        $btnEmail.disabled = false;
        $btnEmail.textContent = 'Sign In / Sign Up';
      }
    });

    /* ---------- Google sign-in ---------- */
    document.getElementById('btnGoogle').addEventListener('click', async () => {
      const btn = document.getElementById('btnGoogle');
      btn.disabled = true;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await auth.signInWithPopup(provider);
        toast('Welcome!', 'success', 1500);
        setTimeout(() => {
          const next = new URLSearchParams(location.search).get('next');
          location.replace(next ? decodeURIComponent(next) : 'index.html');
        }, 400);
      } catch (e) {
        console.error('[login] google error:', e);
        if (e.code === 'auth/popup-blocked') {
          // Try redirect flow
          try {
            await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
            return;
          } catch (e2) {
            toast(friendlyError(e2), 'error', 4000);
          }
        } else {
          toast(friendlyError(e), 'error', 4000);
        }
        btn.disabled = false;
      }
    });

    /* ---------- Forgot password ---------- */
    document.getElementById('btnForgot').addEventListener('click', async () => {
      const email = prompt('Enter your email for reset link:', $email.value.trim());
      if (!email) return;
      try {
        await auth.sendPasswordResetEmail(email.trim().toLowerCase());
        toast('Reset link sent! Check your inbox.', 'success', 4000);
      } catch (e) {
        toast(friendlyError(e), 'error', 4000);
      }
    });

    /* ---------- Handle Google redirect result ---------- */
    auth.getRedirectResult()
      .then((res) => {
        if (res && res.user) {
          const next = new URLSearchParams(location.search).get('next');
          location.replace(next ? decodeURIComponent(next) : 'index.html');
        }
      })
      .catch((e) => {
        if (e && e.code) toast(friendlyError(e), 'error');
      });

    /* ---------- Already signed in? bounce ---------- */
    auth.onAuthStateChanged((u) => {
      if (u) {
        const next = new URLSearchParams(location.search).get('next');
        location.replace(next ? decodeURIComponent(next) : 'index.html');
      }
    });

    console.log('[login] ready');
  </script>
</body>
</html>
