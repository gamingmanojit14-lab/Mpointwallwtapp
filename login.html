<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Login · P2P Wallet</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-center p-6 bg-slate-900">

  <div class="max-w-sm mx-auto w-full">
    <!-- Version marker (visible for debug) -->
    <p class="text-center text-[10px] text-slate-600 mb-3 mono">login.html · v3 · build-2024</p>

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center shadow-2xl shadow-orange-500/30">
        <svg viewBox="0 0 24 24" class="w-12 h-12 text-slate-900" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3.5c.83 0 1.5.67 1.5 1.5h-3c0-.83.67-1.5 1.5-1.5zM9 9h6v2H9V9zm0 4h3v2.5h4V18H9v-5z"/>
        </svg>
      </div>
      <h1 class="mt-6 text-2xl font-bold">P2P Wallet</h1>
      <p class="text-slate-400 text-sm mt-1">Peer-to-peer points ⚡</p>
    </div>

    <!-- Card -->
    <div class="card p-6 space-y-4">

      <!-- Google -->
      <button id="btnGoogle"
        class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-semibold py-3 rounded-xl hover:bg-slate-100 transition">
        <svg viewBox="0 0 48 48" class="w-5 h-5">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.5C29.4 34.7 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.5 5.5C41.9 35.7 44 30.3 44 24c0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 text-slate-500 text-xs">
        <div class="flex-1 h-px bg-slate-700"></div>
        <span>OR</span>
        <div class="flex-1 h-px bg-slate-700"></div>
      </div>

      <!-- Email + Password -->
      <input id="email" type="email" placeholder="Email" autocomplete="email"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition" />
      <input id="password" type="password" placeholder="Password (min 6 chars)" minlength="6"
        autocomplete="current-password"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition" />

      <!-- Two separate buttons -->
      <div class="grid grid-cols-2 gap-2">
        <button id="btnSignIn" type="button"
          class="btn-primary py-3 rounded-xl font-semibold text-sm transition disabled:opacity-60">
          Sign In
        </button>
        <button id="btnSignUp" type="button"
          class="bg-slate-800 border border-slate-600 hover:border-orange-500 py-3 rounded-xl font-semibold text-sm transition disabled:opacity-60">
          Create Account
        </button>
      </div>

      <button id="btnForgot" class="w-full text-slate-400 text-sm hover:text-orange-400 transition">
        Forgot password?
      </button>
    </div>

    <div class="mt-6 text-center text-xs text-slate-500 leading-relaxed">
      <p>New? Click <b class="text-slate-300">Create Account</b>.</p>
      <p class="mt-1">Existing? Click <b class="text-slate-300">Sign In</b>.</p>
    </div>
  </div>

  <script>
    /* ============================================================
     * login.html v3 — Separate SignIn / SignUp
     * ============================================================ */

    const $email = document.getElementById('email');
    const $password = document.getElementById('password');
    const $btnSignIn = document.getElementById('btnSignIn');
    const $btnSignUp = document.getElementById('btnSignUp');
    const $btnGoogle = document.getElementById('btnGoogle');
    const $btnForgot = document.getElementById('btnForgot');

    function friendlyError(e) {
      const code = e.code || '';
      const map = {
        'auth/invalid-email': 'Invalid email address.',
        'auth/user-disabled': 'This account has been disabled.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/invalid-login-credentials': 'Incorrect email or password.',
        'auth/user-not-found': 'No account with this email. Click "Create Account".',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/email-already-in-use': 'Email already registered. Click "Sign In".',
        'auth/too-many-requests': 'Too many attempts. Wait a few minutes.',
        'auth/network-request-failed': 'Network error. Check connection.',
        'auth/operation-not-allowed': '⚠️ Email/Password sign-in NOT enabled in Firebase Console.',
        'auth/popup-blocked': 'Popup blocked. Allow popups and retry.',
        'auth/popup-closed-by-user': 'Google sign-in cancelled.',
        'auth/unauthorized-domain': '⚠️ This domain not authorized. Add it in Firebase Console.',
      };
      return map[code] || e.message || 'Failed. Please try again.';
    }

    function redirectNext() {
      const next = new URLSearchParams(location.search).get('next');
      location.replace(next ? decodeURIComponent(next) : 'index.html');
    }

    /* ---------- SIGN IN ---------- */
    $btnSignIn.addEventListener('click', async () => {
      const email = $email.value.trim().toLowerCase();
      const password = $password.value;

      if (!email) return toast('Enter email', 'error');
      if (!password) return toast('Enter password', 'error');

      $btnSignIn.disabled = true;
      $btnSignIn.textContent = 'Signing in…';

      try {
        await auth.signInWithEmailAndPassword(email, password);
        toast('Welcome back!', 'success', 1200);
        setTimeout(redirectNext, 350);
      } catch (e) {
        console.error('[signin]', e.code, e.message);
        toast(friendlyError(e), 'error', 5000);
        $btnSignIn.disabled = false;
        $btnSignIn.textContent = 'Sign In';
      }
    });

    /* ---------- CREATE ACCOUNT ---------- */
    $btnSignUp.addEventListener('click', async () => {
      const email = $email.value.trim().toLowerCase();
      const password = $password.value;

      if (!email) return toast('Enter email', 'error');
      if (!password) return toast('Enter password', 'error');
      if (password.length < 6) return toast('Password must be at least 6 characters', 'error');

      $btnSignUp.disabled = true;
      $btnSignUp.textContent = 'Creating…';

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        // Set display name
        if (cred.user && !cred.user.displayName) {
          try {
            await cred.user.updateProfile({ displayName: email.split('@')[0] });
          } catch {}
        }
        toast('Account created!', 'success', 1200);
        setTimeout(redirectNext, 350);
      } catch (e) {
        console.error('[signup]', e.code, e.message);
        toast(friendlyError(e), 'error', 5000);
        $btnSignUp.disabled = false;
        $btnSignUp.textContent = 'Create Account';
      }
    });

    /* ---------- GOOGLE ---------- */
    $btnGoogle.addEventListener('click', async () => {
      $btnGoogle.disabled = true;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await auth.signInWithPopup(provider);
        toast('Welcome!', 'success', 1200);
        setTimeout(redirectNext, 350);
      } catch (e) {
        console.error('[google]', e.code, e.message);
        if (e.code === 'auth/popup-blocked') {
          try {
            await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
            return;
          } catch (e2) {
            toast(friendlyError(e2), 'error', 5000);
          }
        } else {
          toast(friendlyError(e), 'error', 5000);
        }
        $btnGoogle.disabled = false;
      }
    });

    /* ---------- FORGOT PASSWORD ---------- */
    $btnForgot.addEventListener('click', async () => {
      const email = ($email.value.trim() || prompt('Enter your email:') || '').trim().toLowerCase();
      if (!email) return;
      try {
        await auth.sendPasswordResetEmail(email);
        toast('Reset link sent to ' + email, 'success', 5000);
      } catch (e) {
        console.error('[forgot]', e.code, e.message);
        toast(friendlyError(e), 'error', 5000);
      }
    });

    /* ---------- ENTER key submits ---------- */
    $password.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $btnSignIn.click();
    });

    /* ---------- Google redirect result ---------- */
    auth.getRedirectResult().then((res) => {
      if (res && res.user) redirectNext();
    }).catch(() => {});

    /* ---------- Auto-bounce if signed in ---------- */
    auth.onAuthStateChanged((u) => {
      if (u) redirectNext();
    });

    console.log('[login] v3 ready — separate signin/signup');
  </script>
</body>
</html>
