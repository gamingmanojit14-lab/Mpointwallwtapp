<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Profile · P2P Wallet</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen pb-24">

  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-md mx-auto flex items-center gap-3 px-4 py-3">
      <a href="dashboard.html" class="text-slate-400 hover:text-orange-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </a>
      <h1 class="font-bold text-lg">Profile</h1>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Avatar + name -->
    <section class="card p-5 text-center">
      <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center text-3xl font-bold text-slate-900">
        <span id="avatarLetter">?</span>
      </div>
      <p id="displayName" class="mt-3 font-semibold text-lg">—</p>
      <p id="displayEmail" class="text-sm text-slate-400">—</p>
      <div class="mt-3 inline-flex items-center gap-2 bg-slate-800 rounded-full px-3 py-1.5">
        <span class="text-xs text-slate-400">Wallet ID:</span>
        <span id="walletId" class="mono text-xs text-orange-400">—</span>
        <button id="copyId" class="text-slate-500 hover:text-orange-400 text-xs">📋</button>
      </div>
    </section>

    <!-- Editable name -->
    <section class="card p-4 space-y-3">
      <label class="text-sm font-medium text-slate-300">Display Name</label>
      <input id="nameInput" type="text" maxlength="40" placeholder="Your name"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500" />
      <button id="btnSaveName" class="btn-primary w-full py-3 rounded-xl font-semibold">Save Name</button>
    </section>

    <!-- Phone link -->
    <section class="card p-4 space-y-3">
      <label class="text-sm font-medium text-slate-300">Linked Phone <span class="text-slate-500 text-xs">(optional)</span></label>
      <input id="phoneInput" type="tel" placeholder="+91XXXXXXXXXX"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500" />
      <p class="text-xs text-slate-500">Others can find you by phone number.</p>
      <button id="btnSavePhone" class="w-full bg-slate-800 hover:bg-slate-700 rounded-xl py-3 font-medium transition">Save Phone</button>
    </section>

    <!-- Security -->
    <section class="card p-4 space-y-3">
      <h3 class="font-semibold text-sm">🔒 Security</h3>
      <button id="btnChangePin" class="w-full bg-slate-800 hover:bg-slate-700 rounded-xl py-3 text-left px-4 flex items-center justify-between transition">
        <span>Change PIN</span>
        <span class="text-slate-500">→</span>
      </button>
      <button id="btnResetPassword" class="w-full bg-slate-800 hover:bg-slate-700 rounded-xl py-3 text-left px-4 flex items-center justify-between transition">
        <span>Reset Password (Email)</span>
        <span class="text-slate-500">→</span>
      </button>
    </section>

    <!-- Admin link (if admin) -->
    <section id="adminSection" class="hidden">
      <a href="admin.html" class="card p-4 flex items-center justify-between hover:border-orange-500 transition">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🛡️</span>
          <div>
            <p class="font-medium">Admin Panel</p>
            <p class="text-xs text-slate-400">Manage users, integrations, config</p>
          </div>
        </div>
        <span class="text-slate-500">→</span>
      </a>
    </section>

    <!-- Logout -->
    <button id="btnLogout" class="w-full bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl py-3 font-medium hover:bg-red-500/20 transition">
      Logout
    </button>

    <p class="text-center text-xs text-slate-500 mt-4">P2P Wallet · v1.0.0</p>
  </main>

  <!-- Change PIN Modal -->
  <div id="pinModal" class="hidden fixed inset-0 z-50 bg-black/70 items-center justify-center p-4">
    <div class="card p-6 w-full max-w-sm space-y-3">
      <h3 class="font-bold text-lg">Change PIN</h3>
      <input id="oldPin" type="password" inputmode="numeric" maxlength="6" placeholder="Current PIN"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center mono tracking-widest focus:outline-none focus:border-orange-500" />
      <input id="newPin" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4–6 digits)"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center mono tracking-widest focus:outline-none focus:border-orange-500" />
      <input id="newPin2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm new PIN"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center mono tracking-widest focus:outline-none focus:border-orange-500" />
      <div id="pinError" class="hidden text-red-400 text-xs"></div>
      <div class="flex gap-2 pt-2">
        <button id="pinCancel" class="flex-1 bg-slate-800 hover:bg-slate-700 rounded-xl py-3 text-sm">Cancel</button>
        <button id="pinConfirm" class="flex-1 btn-primary rounded-xl py-3 text-sm font-semibold">Save</button>
      </div>
    </div>
  </div>

  <script>
    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    let myWalletId = null;

    (async () => {
      const user = await requireAuth();
      if (!user) return;

      myWalletId = await getOwnWalletId();
      const uref = db.collection('users').doc(user.uid);
      const udoc = await uref.get();
      const u = udoc.exists ? udoc.data() : {};

      const name = u.name || user.displayName || (user.email || '').split('@')[0] || 'User';
      document.getElementById('displayName').textContent = name;
      document.getElementById('displayEmail').textContent = user.email || '(no email)';
      document.getElementById('walletId').textContent = myWalletId || '—';
      document.getElementById('nameInput').value = name;
      document.getElementById('phoneInput').value = u.phone || '';
      document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();

      // Admin check
      const adoc = await db.collection('admins').doc(user.uid).get();
      if (adoc.exists) document.getElementById('adminSection').classList.remove('hidden');

      // ---- Save name ----
      document.getElementById('btnSaveName').addEventListener('click', async () => {
        const newName = document.getElementById('nameInput').value.trim();
        if (!newName) return toast('Name cannot be empty', 'error');
        try {
          await uref.set({ name: newName, updatedAt: FV.serverTimestamp() }, { merge: true });
          if (myWalletId) {
            await db.collection('wallets').doc(myWalletId).set({ name: newName }, { merge: true });
          }
          await user.updateProfile({ displayName: newName }).catch(() => {});
          document.getElementById('displayName').textContent = newName;
          document.getElementById('avatarLetter').textContent = newName.charAt(0).toUpperCase();
          toast('Name updated', 'success');
        } catch (e) { toast(e.message, 'error'); }
      });

      // ---- Save phone ----
      document.getElementById('btnSavePhone').addEventListener('click', async () => {
        const raw = document.getElementById('phoneInput').value.trim();
        const digits = raw.replace(/\D/g, '');
        if (!digits || digits.length < 8) return toast('Enter a valid phone number', 'error');
        const key = 'phone:' + digits;
        try {
          // free old index if number changed
          const oldPhone = u.phone || '';
          const oldDigits = oldPhone.replace(/\D/g, '');
          if (oldDigits && oldDigits !== digits) {
            await db.collection('walletIndex').doc('phone:' + oldDigits).delete().catch(() => {});
          }
          await db.collection('walletIndex').doc(key).set({
            walletId: myWalletId, uid: user.uid, phone: digits,
          });
          await uref.set({ phone: raw, updatedAt: FV.serverTimestamp() }, { merge: true });
          toast('Phone linked', 'success');
        } catch (e) { toast(e.message, 'error'); }
      });

      // ---- Change PIN modal ----
      document.getElementById('btnChangePin').addEventListener('click', () => {
        document.getElementById('oldPin').value = '';
        document.getElementById('newPin').value = '';
        document.getElementById('newPin2').value = '';
        document.getElementById('pinError').classList.add('hidden');
        openModal('pinModal');
      });
      document.getElementById('pinCancel').addEventListener('click', () => closeModal('pinModal'));

      document.getElementById('pinConfirm').addEventListener('click', async () => {
        const err = document.getElementById('pinError');
        err.classList.add('hidden');
        const oldPin = document.getElementById('oldPin').value.trim();
        const np = document.getElementById('newPin').value.trim();
        const np2 = document.getElementById('newPin2').value.trim();

        if (!np || np.length < 4 || np.length > 6 || !/^\d+$/.test(np)) {
          err.textContent = 'PIN must be 4–6 digits';
          err.classList.remove('hidden');
          return;
        }
        if (np !== np2) {
          err.textContent = 'PINs do not match';
          err.classList.remove('hidden');
          return;
        }

        const stored = (udoc.exists && u.pinHash) || '';
        if (stored) {
          const oldHash = await sha256Hex(oldPin);
          if (oldHash !== stored) {
            err.textContent = 'Current PIN is incorrect';
            err.classList.remove('hidden');
            return;
          }
        }

        const newHash = await sha256Hex(np);
        try {
          await uref.set({ pinHash: newHash, updatedAt: FV.serverTimestamp() }, { merge: true });
          closeModal('pinModal');
          toast('PIN updated', 'success');
        } catch (e) { toast(e.message, 'error'); }
      });

      // ---- Reset password ----
      document.getElementById('btnResetPassword').addEventListener('click', async () => {
        if (!user.email) return toast('No email on account', 'error');
        try {
          await auth.sendPasswordResetEmail(user.email);
          toast('Reset link sent to ' + user.email, 'success', 4000);
        } catch (e) { toast(e.message, 'error'); }
      });

      // ---- Logout ----
      document.getElementById('btnLogout').addEventListener('click', () => {
        if (confirm('Logout from P2P Wallet?')) logout();
      });

      // ---- Copy wallet ID ----
      document.getElementById('copyId').addEventListener('click', () => {
        if (myWalletId) copyText(myWalletId);
      });
    })();
  </script>
</body>
</html>
